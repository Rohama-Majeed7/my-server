
name: My First Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Test Node.js
        run: node --version

      - name: Pipeline message
        run: echo "My GitHub Actions pipeline is working!"
